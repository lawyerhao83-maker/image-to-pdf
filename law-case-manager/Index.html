<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案件管理簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#15202D; --muted:#5A6676; --line:#D7DDE5;
  --accent:#1F4A86; --accent-ink:#FFFFFF; --accent-soft:#E2EAF6;
  --crit:#B02A20; --crit-soft:#F8E2DF; --warn:#9A6200; --warn-soft:#FAEFD6; --ok:#2C7650; --ok-soft:#DCEFE3;
  --head:#14243A; --head-ink:#EEF2F8; --head-muted:#9FB0C8;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E131A; --surface:#161D27; --sunk:#1C2531; --ink:#E5EAF1; --muted:#97A3B3; --line:#2A3443;
  --accent:#8EB1E9; --accent-ink:#0E1828; --accent-soft:#1D2B42;
  --crit:#F08B82; --crit-soft:#3B1B18; --warn:#E4B45E; --warn-soft:#382B12; --ok:#7DC8A0; --ok-soft:#16301F;
  --head:#0A111B; --head-ink:#E5EAF1; --head-muted:#8496AF; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-disp);font-size:20px;margin:0;letter-spacing:.06em}
.brand small{color:var(--head-muted);font-size:12px;font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{color:var(--head-muted);background:none;border:0;padding:6px 12px;border-radius:6px;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--head-ink);background:rgba(255,255,255,.1)}
nav.tabs button:hover{color:var(--head-ink)}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--head-muted)}
.me a{color:var(--head-muted)}
main{padding-block:24px 64px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
h2{font-size:18px;margin:0;font-weight:700}
h3{font-size:13px;margin:0 0 8px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.section{display:flex;flex-direction:column;gap:14px;margin-bottom:32px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--crit);border-color:var(--crit-soft)}
button.danger.arm{background:var(--crit);color:var(--surface);border-color:var(--crit)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:14px 16px}
.stats b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:13px;color:var(--muted)}
.stats .crit b{color:var(--crit)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.done{opacity:.55}
@media (max-width:520px){.item{grid-template-columns:76px minmax(0,1fr);}.item>.row:last-child{grid-column:1/-1}}
.date{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;line-height:1.3}
.date small{display:block;color:var(--muted);font-size:12px}
.t{min-width:0}
.t b{font-weight:500}
.t a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.pill.k-開庭{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.left{font-family:var(--f-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.left.crit{color:var(--crit);font-weight:500}.left.warn{color:var(--warn);font-weight:500}
.tick{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:6px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.filters input[type=search]{max-width:280px}
.filters select{width:auto}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.chk input{width:auto}
.month{font-family:var(--f-disp);font-size:16px;margin:8px 0 0}
.scrim{position:fixed;inset:0;background:rgba(10,16,26,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer .hd{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:1;padding:14px 20px;display:flex;gap:12px;align-items:flex-start}
.drawer .bd{padding:20px 20px 40px;display:flex;flex-direction:column;gap:24px}
.drawer.modal{width:min(620px,100%)}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.facts div{background:var(--surface);padding:10px 14px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts a{color:var(--accent)}
@media (max-width:520px){.facts{grid-template-columns:minmax(0,1fr)}}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.people{display:flex;gap:6px;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;border:1px solid transparent;color:var(--ink)}
.person input{width:auto;margin:0;accent-color:var(--accent)}
.person.on{background:var(--accent-soft);border-color:var(--accent)}
.log .e{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.log .e:first-child{border-top:0}
.log .e p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.calc{background:var(--sunk);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.calc .hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:var(--surface)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>案件管理簿</h1><small id="today"></small></div>
  <nav class="tabs" aria-label="主選單">
    <button type="button" data-v="dashboard">總覽</button>
    <button type="button" data-v="cases">案件</button>
    <button type="button" data-v="calendar">期日</button>
  </nav>
  <div class="me" id="me"></div>
</div></header>
<main class="wrap">
  <div id="banner"></div>
  <div id="view"><div class="empty">正在讀取案件資料…</div></div>
</main>
<div id="overlay"></div>

<script>
var TYPES=["民事","刑事","家事","行政","非訟","強制執行","法律顧問","其他"];
var STAGES=["偵查","第一審","第二審","第三審","再審","抗告","調解","執行","訴訟外"];
var STATUSES=["進行中","暫停","結案"];
var KINDS=["開庭","書狀期限","上訴期限","抗告期限","會議","其他"];
var PERIODS=[
  {label:"民事上訴 20 日（民訴§440）",d:20,kind:"上訴期限"},
  {label:"民事抗告 10 日（民訴§487）",d:10,kind:"抗告期限"},
  {label:"刑事上訴 20 日（刑訴§349）",d:20,kind:"上訴期限"},
  {label:"刑事抗告 10 日（刑訴§406）",d:10,kind:"抗告期限"},
  {label:"行政訴訟上訴 20 日（行訴§241）",d:20,kind:"上訴期限"},
  {label:"支付命令異議 20 日（民訴§516）",d:20,kind:"書狀期限"},
  {label:"自訂天數",d:0,kind:"書狀期限"}
];
var WD="日一二三四五六";
var S={me:"",staff:[],cases:[],events:[],today:"",sheetUrl:"",loaded:false,err:"",
  view:"dashboard",openId:null,logs:[],logsFor:null,f:{q:"",status:"進行中",type:"",mine:false},showDone:false,busy:0};

/* ---------- helpers ---------- */
function h(tag,props){var el=document.createElement(tag);props=props||{};
  Object.keys(props).forEach(function(k){var v=props[k];if(v==null||v===false)return;
    if(k==="class")el.className=v;else if(k==="text")el.textContent=v;
    else if(k.indexOf("on")===0)el.addEventListener(k.slice(2),v);
    else if(["value","checked","disabled","selected","required"].indexOf(k)>=0)el[k]=v;
    else el.setAttribute(k,v===true?"":v);});
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);return el;}
function add(el,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}el.append(c instanceof Node?c:String(c));}
function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayISO(){return S.today||iso(new Date());}
function parse(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function roc(s){if(!s)return"";var d=parse(s);return(d.getFullYear()-1911)+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate());}
function wd(s){return s?"週"+WD[parse(s).getDay()]:"";}
function daysLeft(s){return Math.round((parse(s)-parse(todayISO()))/864e5);}
function urg(e){if(e.done)return"";var n=daysLeft(e.date);return n<0?"crit":n<=3?"warn":"";}
function leftText(e){if(e.done)return"已完成";var n=daysLeft(e.date);return n<0?"逾期 "+(-n)+" 日":n===0?"今天":n+" 日後";}
function toast(msg,err){var t=h("div",{class:"toast"+(err?" err":""),role:"status",text:msg});document.body.append(t);setTimeout(function(){t.remove();},err?6000:2200);}
function name(email){var s=S.staff.find(function(x){return x.email===email;});return s&&s.name?s.name:(email||"同事");}
function caseById(id){return S.cases.find(function(c){return c.id===id;});}
function opt(list,cur,blank){var o=list.map(function(v){return h("option",{value:v,text:v,selected:v===cur});});if(blank!=null)o.unshift(h("option",{value:"",text:blank}));return o;}
function confirmBtn(label,fn){var armed=false,t;var b=h("button",{type:"button",class:"danger",text:label,onclick:function(){
  if(!armed){armed=true;b.classList.add("arm");b.textContent="再按一次確定";t=setTimeout(function(){armed=false;b.classList.remove("arm");b.textContent=label;},4000);return;}
  clearTimeout(t);fn();}});return b;}

/* ---------- server ---------- */
function run(fn){var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(function(x){res(x?JSON.parse(x):x);}).withFailureHandler(rej);r[fn].apply(r,args);});}
function errText(e){var m=(e&&e.message)||String(e);return m.replace(/^Error:\s*/,"").replace(/^Exception:\s*/,"").replace(/^CONFLICT:/,"");}
async function save(fn,args,ok){
  S.busy++;try{var r=await run.apply(null,[fn].concat(args));if(ok)toast(ok);await load();return r||true;}
  catch(e){toast(errText(e),true);if(/CONFLICT:/.test((e&&e.message)||""))await load();return false;}
  finally{S.busy--;}}
async function load(){
  try{var d=await run("apiLoad");S.me=d.me;S.staff=d.staff;S.cases=d.cases;S.events=d.events.filter(function(e){return e.date;});
    S.today=d.today;S.sheetUrl=d.sheetUrl;S.owner=d.owner;S.loaded=true;S.err="";
    if(S.openId)await loadLogs(S.openId);}
  catch(e){S.err=errText(e);S.loaded=true;}
  render();}
async function loadLogs(id){try{S.logs=await run("apiLogs",id);S.logsFor=id;}catch(e){S.logs=[];}}

/* ---------- render ---------- */
function setView(v){S.view=v;document.querySelectorAll("nav.tabs button").forEach(function(b){if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});render();}
document.querySelectorAll("nav.tabs button").forEach(function(b){b.addEventListener("click",function(){setView(b.dataset.v);});});

function render(){
  var banner=document.getElementById("banner");banner.replaceChildren();
  if(S.err)banner.append(h("div",{class:"banner crit",text:S.err}));
  var me=document.getElementById("me");me.replaceChildren();
  if(S.me)me.append(h("span",{text:name(S.me)}));
  if(S.sheetUrl)me.append(h("a",{href:S.sheetUrl,target:"_blank",rel:"noopener",text:"試算表"}));
  var v=document.getElementById("view");
  if(!S.loaded){v.replaceChildren(h("div",{class:"empty",text:"正在讀取案件資料…"}));return;}
  if(S.err&&!S.cases.length){v.replaceChildren();return;}
  v.replaceChildren(S.view==="cases"?viewCases():S.view==="calendar"?viewCalendar():viewDash());
  if(S.openId&&!document.querySelector("#overlay .modal"))renderDrawer();
}

function eventRow(e,showCase){
  if(showCase==null)showCase=true;
  var c=caseById(e.caseId),u=urg(e);
  var tick=h("input",{type:"checkbox",class:"tick",title:"標記完成","aria-label":"標記完成",checked:!!e.done,
    onchange:function(ev){save("apiSetDone",[e.id,ev.target.checked],ev.target.checked?"已標記完成":"已取消完成");}});
  return h("div",{class:"item"+(e.done?" done":"")},
    h("div",{class:"date"},roc(e.date),h("small",{text:wd(e.date)+(e.time?" "+e.time:"")})),
    h("div",{class:"t"},
      h("div",{class:"row",style:"gap:8px"},h("span",{class:"pill k-"+e.kind,text:e.kind}),
        showCase&&c?h("b",{},h("a",{onclick:function(){openCase(c.id);},text:c.title})):h("b",{text:showCase?"":(e.note||e.kind)})),
      h("div",{class:"meta",text:[showCase?e.note:"",e.place,c&&c.courtNo].filter(Boolean).join("　·　")})),
    h("div",{class:"row",style:"gap:10px;justify-content:flex-end"},h("span",{class:"left "+u,text:leftText(e)}),tick));}

function nextEvent(cid){return S.events.filter(function(e){return e.caseId===cid&&!e.done;}).sort(function(a,b){return a.date.localeCompare(b.date);})[0];}
function byTime(a,b){return(a.date+(a.time||"")).localeCompare(b.date+(b.time||""));}

function viewDash(){
  var t=todayISO();var open=S.cases.filter(function(c){return c.status!=="結案";});
  var pending=S.events.filter(function(e){return!e.done;});
  var overdue=pending.filter(function(e){return e.date<t;});
  var week=pending.filter(function(e){return e.date>=t&&daysLeft(e.date)<=7;});
  var fresh=S.cases.filter(function(c){return(c.openedAt||"").slice(0,7)===t.slice(0,7);});
  var upcoming=pending.filter(function(e){return daysLeft(e.date)<=21;}).sort(byTime);
  var mine=open.filter(function(c){return c.lawyers.indexOf(S.me)>=0;});
  return h("div",{},
    h("div",{class:"section"},h("div",{class:"stats"},
      h("div",{},h("b",{text:open.length}),h("span",{text:"未結案件"})),
      h("div",{},h("b",{text:week.length}),h("span",{text:"7 日內期日"})),
      h("div",{class:overdue.length?"crit":""},h("b",{text:overdue.length}),h("span",{text:"逾期未完成"})),
      h("div",{},h("b",{text:fresh.length}),h("span",{text:"本月新收（"+(+t.slice(5,7))+" 月）"})))),
    h("div",{class:"section"},
      h("div",{class:"row"},h("h2",{text:"三週內的期日"}),h("span",{class:"sp"}),h("button",{class:"primary",onclick:function(){eventForm();},disabled:!S.cases.length,text:"新增期日"})),
      h("div",{class:"list"},upcoming.length?upcoming.map(function(e){return eventRow(e);}):
        h("div",{class:"empty",text:S.cases.length?"三週內沒有待辦期日。":"先到「案件」建立第一件案件，再加上開庭日與期限。"}))),
    h("div",{class:"section"},h("h2",{text:"我承辦的未結案件"}),
      h("div",{class:"list"},mine.length?mine.map(caseItem):h("div",{class:"empty",text:"還沒有把你列為承辦人的案件。"}))));}

function caseItem(c){var n=nextEvent(c.id);
  return h("div",{class:"item"},
    h("div",{class:"date"},n?roc(n.date):"—",h("small",{text:n?n.kind:"無期日"})),
    h("div",{class:"t"},h("b",{},h("a",{onclick:function(){openCase(c.id);},text:c.title})),
      h("div",{class:"meta",text:[c.client&&"委任人 "+c.client,c.court,c.courtNo].filter(Boolean).join("　·　")})),
    h("span",{class:"pill",text:c.type||""}));}

function statusPill(s){return h("span",{class:"pill "+(s==="結案"?"":s==="暫停"?"warn":"ok"),text:s||"進行中"});}

function viewCases(){
  var f=S.f,q=f.q.trim().toLowerCase();
  var rows=S.cases.filter(function(c){return(!f.status||c.status===f.status)&&(!f.type||c.type===f.type)&&(!f.mine||c.lawyers.indexOf(S.me)>=0)
    &&(!q||[c.code,c.title,c.client,c.opponent,c.court,c.courtNo,c.division].join(" ").toLowerCase().indexOf(q)>=0);});
  rows.sort(function(a,b){return(b.code||"").localeCompare(a.code||"");});
  var search=h("input",{type:"search",id:"q",placeholder:"搜尋案由、當事人、案號…",value:f.q,oninput:function(e){f.q=e.target.value;clearTimeout(search._t);

      h("span",{class:"sp"}),h("button",{type:"button",onclick:back,text:"取消"}),btn));
